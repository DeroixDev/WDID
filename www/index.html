<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#F3F4F1">
<title>WDID</title>
<link rel="stylesheet" href="styles.css">
<script>
  // Theme schon vor dem ersten Bild setzen, damit nichts aufblitzt
  try { const l = JSON.parse(localStorage.getItem('wdid.look') || '{}'); if (l.theme) document.documentElement.dataset.theme = l.theme; if (l.motion === false) document.documentElement.dataset.motion = 'off'; } catch (e) {}
</script>
</head>
<body>
<div class="app" id="app"></div>

<button class="fab" id="fab" aria-label="Neuer Eintrag">
  <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
</button>

<nav class="tabs" aria-label="Bereiche">
  <div class="inner">
    <button data-tab="heute" aria-current="page"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>Heute</button>
    <button data-tab="orte"><svg viewBox="0 0 24 24"><path d="M12 21s-6-5.6-6-11a6 6 0 1 1 12 0c0 5.4-6 11-6 11z"/><circle cx="12" cy="10" r="2.2"/></svg>Orte</button>
    <button data-tab="papiere"><svg viewBox="0 0 24 24"><path d="M4 7h16v12H4z"/><path d="M4 7l8 6 8-6"/></svg>Papiere</button>
    <button data-tab="verlauf"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.3-5.7M4 4v4h4"/><path d="M12 8v4l3 2"/></svg>Verlauf</button>
    <button data-tab="alles"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></svg>Alles</button>
  </div>
</nav>

<div id="sheetRoot"></div>
<div id="toastRoot"></div>

<script src="vendor/capacitor.js"></script>
<script src="build-info.js"></script>
<script src="js/logic.js"></script>
<script src="js/app.js"></script>
</body>
</html>
